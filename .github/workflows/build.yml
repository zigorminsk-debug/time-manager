name: Build & Release APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: |
          RUN="${{ github.run_number }}"
          CODE="$((1000 + RUN))"
          NAME="1.0.${RUN}"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Версия: $NAME ($CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (разбор дат и времени)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee test.log

      - name: Assemble signed release
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }} \
            --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '```'
            for f in test.log build.log; do
              if [ -f "$f" ]; then
                echo "===== $f ====="
                tail -c 40000 "$f"
              fi
            done
            echo
            echo "===== test-results ====="
            find app/build/test-results -name '*.xml' -maxdepth 3 2>/dev/null | head -5 | while read -r x; do
              echo "--- $x"
              grep -E "<failure|<error|message=" "$x" | head -30
            done
            echo '```'
          } > body.md
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@body.md || true
          grep -hE "e: |error:|FAILURE|What went wrong|FAILED|AssertionError" test.log build.log 2>/dev/null | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          APK="app/build/outputs/apk/release/app-release.apk"
          NAME="${{ steps.version.outputs.name }}"
          # два имени: версионированное (для людей) и постоянное (для автообновления)
          cp "$APK" "dist/time-manager-${NAME}.apk"
          cp "$APK" "dist/time-manager.apk"
          cd dist
          sha256sum "time-manager-${NAME}.apk" "time-manager.apk" | tee sha256.txt
          echo "sha256_line=$(head -1 sha256.txt)" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: time-manager-${{ steps.version.outputs.name }}
          path: dist/*
          retention-days: 90

      - name: Verify APK signature
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          if [ -x "$BT" ]; then
            "$BT" verify --print-certs "dist/time-manager-${{ steps.version.outputs.name }}.apk"
          else
            echo "apksigner не найден — пропускаем"
          fi

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME="${{ steps.version.outputs.name }}"
          CODE="${{ steps.version.outputs.code }}"
          HASH="$(cut -d' ' -f1 dist/sha256.txt)"
          cat > notes.md <<EOF
          Автоматическая сборка.

          versionCode: $CODE
          versionName: $NAME
          sha256: $HASH

          APK подписан постоянным ключом, поэтому устанавливается поверх предыдущих версий
          и обновляется автоматически из самого приложения.

          Файлы релиза:
          - time-manager.apk — постоянное имя для автообновления;
          - time-manager-$NAME.apk — та же сборка с версией в имени;
          - sha256.txt — контрольные суммы.
          EOF
          gh release create "v$NAME" \
            "dist/time-manager-${NAME}.apk" \
            "dist/time-manager.apk" \
            "dist/sha256.txt" \
            --title "Тайм-менеджер $NAME" \
            --notes-file notes.md \
            --latest
